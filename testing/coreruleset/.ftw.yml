# Tests should not just be ignored via .ftw.yml, but new expectations for each test should be set.
# Avoid as much as possible adding new entries here, in favor of .ftw-overrides.yml.
# Multiphase-specific test ignores should be added to .ftw-multiphase.yml. They are combined with this file only when
# coraza.rule.multiphase_evaluation build tag is set.
---
testoverride:
  ignore: {}
