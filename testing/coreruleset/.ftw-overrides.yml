version: "v0.0.0"
meta:
  engine: "coraza"
  platform: "go"
  annotations:
    - purpose: "Overrides for CRS test suite running against Coraza deployed as a Go middleware"
test_overrides:
  - rule_id: 920100
    test_ids: [4]
    reason: |
      Albedo has no handler for a CONNECT request and answers 404 instead of 200.
      Coraza sees the request (911100 matches) and 920100 does not, as the test expects.
    output:
      status: 404
      log:
        no_expect_ids: [920100]
  - rule_id: 920100
    test_ids: [5]
    reason: |
      Apache rejects a CONNECT to a domain without a port with 400 before CRS runs.
      Go parses the target as an authority, so Coraza sees the URI as
      //www.coreruleset.org, 920100 does not match, and albedo answers 404.
    output:
      status: 404
      log:
        no_expect_ids: [920100]
  - rule_id: 920100
    test_ids: [8]
    reason: |
      On Apache is not allowed to put a colon in the path. Go/http allows it.
      Note that the colon is a legal character in a regular path segment, according to the RFC.
    output:
      status: 200
      log:
        no_expect_ids: [920100]
  - rule_id: 920270
    test_ids: [4]
    reason: "Rule works, Apache test expects status 400"
    output:
      log:
        expect_ids: [920270]
  - rule_id: 920274
    test_ids: [1]
    reason: "Host validation. Apache expects status 400. Coraza correctly triggers the rule 920274"
    output:
      log:
        expect_ids: [920274]
  - rule_id: 920280
    test_ids: [3]
    reason: "Go answers HTTP/0.9 with 505 HTTP Version Not Supported before Coraza runs; Apache answers 400"
    output:
      status: 505
  - rule_id: 920290
    test_ids: [1]
    reason: "TODO"
    output:
      log:
        expect_ids: [920280] # TODO: understand why 920280 (Missing Host Header) is triggered and not 920290 (Empty Host header). See what go-ftw sends.
  - rule_id: 920290
    test_ids: [4]
    reason: "TODO"
    output:
      log:
        expect_ids: [920280] # TODO: understand why 920280 (Missing Host Header) is triggered and not 920290 (Empty Host header). See what go-ftw sends.
  - rule_id: 920430
    test_ids: [3, 9]
    reason: "Go answers HTTP/0.9 and HTTP/0.8 with 505 HTTP Version Not Supported before Coraza runs; Apache answers 400"
    output:
      status: 505
  - rule_id: 920430
    test_ids: [5]
    reason: |
      Apache reads a request line without a version as HTTP/0.9. Go rejects it
      with 400 Bad Request before Coraza runs, so go-ftw gets a normal response.
    output:
      status: 400
  - rule_id: 920430
    test_ids: [8]
    reason: "Go/http does not allow HTTP/3.0 - 505 HTTP Version Not Supported"
    output:
      status: 505
      log:
        no_expect_ids: [920430]
  - rule_id: 920610
    test_ids: [2]
    reason: |
      Apache rejects a raw fragment in the URI with 400. Go reads the request
      target as a path and req.URL.String() escapes '#', so Coraza sees
      /%23fragment and 920610 does not match.
    output:
      status: 200
      log:
        no_expect_ids: [920610]
  - rule_id: 920620
    test_ids: [1]
    reason: "Go/http retains multiple separate Content-Type headers, which is what this rule is looking for"
    output:
     log:
      expect_ids: [920620]
  - rule_id: 922130
    test_ids: [1,2,7]
    reason: "Multipart parsing tests. 922130 rule is not reached, Coraza triggers rule 200003 (MULTIPART_STRICT_ERROR) at parsing time"
    output:
      log:
        expect_ids: [200003]
  - rule_id: 922130
    test_ids: [4]
    reason: |
      Multipart parsing tests. A space character is not in the valid range. 0x20 character raises MULTIPART_STRICT_ERROR (see multipart_error.yaml engine test),
      But 922130-4 test does not. In this case, rule 922130 is matched.
    output:
      log:
        expect_ids: [922130]
  - rule_id: 922130
    test_ids: [3,5,6]
    reason: "Valid Multipart parsing payloads. Coraza should not trigger rules 200002 (REQBODY_ERROR), 200003 (MULTIPART_STRICT_ERROR), 922130"
    output:
      log:
        no_expect_ids: [200002,200003,922130]
